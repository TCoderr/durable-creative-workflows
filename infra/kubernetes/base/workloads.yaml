apiVersion: apps/v1
kind: Deployment
metadata:
  name: velin-api
spec:
  # A reviewed release must supply immutable digests/configuration before replicas > 0.
  replicas: 0
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: velin-api
  template:
    metadata:
      labels:
        app: velin-api
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: velin-api
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: velin-control:REQUIRES_DIGEST
          imagePullPolicy: IfNotPresent
          args: [api]
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: HTTP_ADDR
              value: ":8080"
          envFrom:
            - configMapRef:
                name: velin-config
            - secretRef:
                name: velin-api-secrets
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
          volumeMounts:
            - name: temporary
              mountPath: /tmp
      volumes:
        - name: temporary
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: velin-api
spec:
  selector:
    app: velin-api
  ports:
    - port: 8080
      targetPort: http
      name: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: velin-api
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: velin-api
---
