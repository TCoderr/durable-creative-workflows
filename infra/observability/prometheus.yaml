global:
  scrape_interval: 10s
scrape_configs:
  - job_name: velin-api
    static_configs:
      - targets: [api:8080]
  - job_name: velin-worker
    static_configs:
      - targets: [worker:8081]
  - job_name: velin-capabilities
    authorization:
      type: Bearer
      credentials_file: /run/secrets/capabilities-token
    static_configs:
      - targets: [capabilities:8000]
